global:
  imageRegistry: ""

credentials:
  # Root password for ArcadeDB server
  rootPassword: ""
  existingSecret: ""
  existingSecretKey: "rootPassword"

# Additional annotations
annotations: {}

# The number of replicas to create. If you increase this value you should add `arcadedb.ha` parameters to args section
# https://docs.arcadedb.com/#High-Availability
  # - "-Darcadedb.ha.enabled=true"
  # - "-Darcadedb.ha.replicationIncomingHost=0.0.0.0"
  # - "-Darcadedb.ha.serverList=arcadedb-0.arcadedb.{{ .Release.Namespace }}.svc.cluster.local:2424"
  # - "-Darcadedb.ha.k8s=true"
  # - "-Darcadedb.ha.k8sSuffix=.arcadedb.{{ .Release.Namespace }}.svc.cluster.local"

replicas: 1

# Docker image 
image:
  registry: docker.io
  repository: arcadedata/arcadedb
  tag: "26.9.1"
  pullPolicy: IfNotPresent

# Server's parameters
args: |
  - "-Darcadedb.dumpConfigAtStartup=true"
  - "-Darcadedb.server.name=${HOSTNAME}"
  - "-Darcadedb.server.rootPassword=${ARCADEDB_ROOT_PASSWORD}"
  - "-Darcadedb.server.databaseDirectory=/mnt/data0/databases"
  - "-Darcadedb.server.defaultDatabases=DemoDb[]"
  - "-Darcadedb.server.plugins=GremlinServer:com.arcadedb.server.gremlin.GremlinServerPlugin"


service:
  # The HTTP Service port
  httpPort: 2480
  # The RPC Service port
  rpcPort: 2424
  # The Gremlin Service port
  gremlinPort: 8182

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

# The resources section
resources: {}
resourcesPreset: "medium"

podSecurityContext:
  enabled: true
  fsGroup: 1001
  runAsNonRoot: true
  fsGroupChangePolicy: Always
  sysctls: []
  supplementalGroups: []

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  seLinuxOptions: {}
  runAsNonRoot: true
  privileged: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: "RuntimeDefault"

pdb:
  create: true
  minAvailable: ""
  maxUnavailable: ""

podLabels: {}

podAnnotations: {}

## @param podAffinityPreset Pod affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAffinityPreset: ""
## @param podAntiAffinityPreset Pod anti-affinity preset. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAntiAffinityPreset: soft
## Node affinity preset
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
##
nodeAffinityPreset:
  ## @param nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
  ##
  type: ""
  ## @param nodeAffinityPreset.key Node label key to match. Ignored if `affinity` is set.
  ## E.g.
  ## key: "kubernetes.io/e2e-az-name"
  ##
  key: ""
  ## @param nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set.
  ## E.g.
  ## values:
  ##   - e2e-az1
  ##   - e2e-az2
  ##
  values: []

# Pod affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - arcadedb
          topologyKey: kubernetes.io/hostname

## @param tolerations Tolerations for pod assignment
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
##
tolerations: []
## @param topologySpreadConstraints Topology Spread Constraints for pod assignment spread across your cluster among failure-domains. Evaluated as a template
## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/#spread-constraints-for-pods
##
topologySpreadConstraints: []

volumePermissions:
  enabled: false
  image:
    registry: docker.io
    repository: alpine
    tag: 3.23.2
    pullPolicy: IfNotPresent
  containerSecurityContext:
    runAsUser: 0
    readOnlyRootFilesystem: true
    seLinuxOptions: {}
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  resources: {}
  resourcesPreset: "nano"

persistence:
  enabled: true
  existingClaim: ""
  subPath: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}
  selector: {}
  dataSource: {}

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /api/v1/ready
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 6

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /api/v1/ready
    port: http
  initialDelaySeconds: 180
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 6

# Pod management policy
podManagementPolicy: "OrderedReady"

# Update strategy
updateStrategy:
  type: RollingUpdate # RollingUpdate OR OnDelete